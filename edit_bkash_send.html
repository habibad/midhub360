    <script>
        $(document).ready(function () {
            // Fetch data when an ID is selected
            $('#id').change(function () {
                var id = $(this).val();
                if (id) {
                    $.ajax({
                        url: 'fetch_bkash_send.php',
                        type: 'POST',
                        data: {id: id},
                        dataType: 'json',
                        success: function (response) {
                            if(response) {
                                // Populate form fields with fetched data
                                $('#edit_id').val(response.id);
                                $('#company_name').val(response.company_name);
                                $('#ac_number').val(response.ac_number);
                                $('#type').val(response.type);
                                $('#remarks').val(response.remarks);
                                $('#balance').val(response.balance);
                                $('#charge').val(response.charge);
                                $('#amount').val(response.amount);
                                $('#status').val(response.status);
                            } else {
                                alert('No data found for the selected ID.');
                                $('#editForm').trigger("reset");
                            }
                        },
                        error: function (xhr, status, error) {
                            alert('Failed to fetch data. Error: ' + error);
                        }
                    });
                } else {
                    // Clear form if no ID is selected
                    $('#editForm').trigger("reset");
                }
            });
        });
    </script>
</body>
